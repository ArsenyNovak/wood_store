{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
<header class="header">
  <div class="header__inner container">
    <a class="header__brand" href="{{ url_for('read_root') }}">
      <span class="header__logo" role="img" aria-hidden="true"></span>
    </a>

    <nav class="header__controls" aria-label="Фильтры">
      <form id="category-form" method="get" class="filter">
        <label for="category" class="visually-hidden">Категория</label>
        <select id="category" name="category" class="filter__select">
          <option value="all" {% if selected_category == "all" %}selected{% endif %}>Все изделия</option>
          {% for category in categories %}
          <option value="{{ category.category_id }}" {% if selected_category == category.category_id|string %}selected{% endif %}>{{ category.title }}</option>
          {% endfor %}
        </select>
      </form>

      <button type="button" class="header__cart" aria-label="Перейти в корзину">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6H21L20 12H8L6 6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"/>
          <path d="M7 18a2 2 0 100 4 2 2 0 000-4zM17 18a2 2 0 100 4 2 2 0 000-4z" fill="currentColor"/>
        </svg>
        <span class="visually-hidden">Корзина</span>
        <span id="cartCount" class="header__badge">0</span>
      </button>
    </nav>
  </div>
</header>

<main class="container main">
  <section aria-live="polite" class="product-list">
    <div id="products" class="product-list__grid"></div>
    <div id="no-products-message" class="product-list__empty">Товары не найдены</div>
    <div id="scroll-sentinel"></div>
  </section>

  <!-- Product modal -->
  <dialog class="product-modal" id="productModal" aria-hidden="true">
    <div class="product-modal__wrap">
      <div class="product-modal__slider-wrap">
        <div class="product-modal__slider" data-slider></div>
        <button class="product-modal__btn product-modal__btn--prev" aria-label="Посмотреть предыдущий слайд">&lt;</button>
        <button class="product-modal__btn product-modal__btn--next" aria-label="Посмотреть следующий слайд">&gt;</button>
      </div>

      <div class="product-modal__content" data-modal-content></div>

      <button class="product-modal__close" aria-label="Закрыть модальное окно">
      </button>
    </div>
  </dialog>

  <!-- Cart dialog (reworked markup uses BEM elements inside) -->
  <dialog class="cart-modal" id="cartModal" aria-hidden="true">
    <div class="cart-modal__wrapper" id="cart">
      <button class="cart-modal__close" aria-label="Закрыть корзину">
        <span class="cart-modal__close-line"></span>
        <span class="cart-modal__close-line"></span>
      </button>

      <div id="no-products-in-cart" class="cart-modal__empty">В корзине пока пусто</div>
      <!-- JS динамически добавляет .cart-modal__item -->
      <!-- summary будет добавлена JS в конец контейнера -->
    </div>
  </dialog>
</main>

{% endblock %}

{% block scripts %}
  <script type="module" src="/wood/static/js/index.js"></script>
{% endblock %}
